name = "pc-health-dashboard"
main = "src/worker.js"
compatibility_date = "2026-11-19"
workers_dev = true

[[kv_namespaces]]
binding = "HEALTH_KV"
id = "e2f0658e893943b79d132f7903b943c1"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
STALE_AFTER_SECONDS = "300"
HISTORY_LIMIT = "30"
DEVICE_TTL_SECONDS = "2592000"
